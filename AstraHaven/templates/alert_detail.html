{% extends "base.html" %}{% block content %}<p class="eyebrow">Alert detail</p><h1>{{ alert.title }}</h1><section class="panel"><span class="severity {{ alert.severity }}">{{ alert.severity }}</span><p>{{ alert.description }}</p><p>Status: {{ 'Resolved' if alert.resolved else 'Open' }}</p>{% if not alert.resolved and current_user.role in ['admin', 'analyst'] %}<form method="post" action="{{ url_for('alerts.resolve', alert_id=alert.id) }}"><button type="submit">Resolve alert</button></form>{% endif %}</section>{% endblock %}
