{% extends "base.html" %}

{% block title %}
Suppliers — AstraHaven
{% endblock %}

{% block content %}

<h1>Suppliers</h1>

<form
        method="post"
        action="{{ url_for('suppliers.create') }}"
>

    <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
    >

    <label>
        Supplier Name
        <input
                type="text"
                name="name"
                maxlength="200"
                required
        >
    </label>

    <label>
        Category
        <input
                type="text"
                name="category"
                maxlength="100"
                required
        >
    </label>

    <button type="submit">
        Add Supplier
    </button>

</form>

<hr>

<table>

    <thead>
    <tr>
        <th>Name</th>
        <th>Category</th>
        <th>Active</th>
    </tr>
    </thead>

    <tbody>

    {% for supplier in suppliers %}

    <tr>
        <td>{{ supplier.name }}</td>
        <td>{{ supplier.category }}</td>
        <td>{{ "Yes" if supplier.active else "No" }}</td>
    </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
