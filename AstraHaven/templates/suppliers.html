{% extends "base.html" %}{% block content %}<p class="eyebrow">Partner network</p><h1>Suppliers</h1><section class="panel">{% for name, transactions in suppliers.items() %}<div class="row"><span><b>{{ name }}</b><small>{{ transactions|length }} transaction(s)</small></span><span>${{ '%.2f'|format(transactions|sum(attribute='amount')) }}</span></div>{% else %}<p>No suppliers yet.</p>{% endfor %}</section>{% endblock %}
