{% extends "base.html" %}

{% block title %}
Login — AstraHaven
{% endblock %}

{% block content %}
<div class="login-card">
    <h1>AstraHaven</h1>
    <p>Secure business anomaly monitoring.</p>

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>
            Username or email
            <input type="text" name="username" required maxlength="255" autocomplete="username">
        </label>

        <label>
            Password
            <input type="password" name="password" required autocomplete="current-password">
        </label>

        <button type="submit">Sign in</button>
    </form>
</div>
{% endblock %}
