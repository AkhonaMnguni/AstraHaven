{% extends "base.html" %}{% block content %}<p class="eyebrow">Monitoring</p><h1>Alerts</h1><section class="panel">{% for alert in alerts %}<a class="row" href="{{ url_for('alerts.detail', alert_id=alert.id) }}"><span><b>{{ alert.title }}</b><small>{{ alert.created_at }}</small></span><span class="severity {{ alert.severity }}">{{ alert.severity }}</span></a>{% else %}<p>No alerts recorded.</p>{% endfor %}</section>{% endblock %}
